<title>BattleShipDX Asset Editor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: barra superior, 3 columnas (categorias | cuadricula | inspector). Editor oscuro a proposito. */
:root{--bg:#14161a;--panel:#1b1e24;--panel2:#22262d;--line:#2d323b;--fg:#e6e8ec;--mut:#8b93a1;--acc:#ff7a3d;--acc2:#2e6bff;--ok:#3ecf8e;--chk1:#2a2e36;--chk2:#323741;color-scheme:dark;
--ui:'IBM Plex Sans',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.4 var(--ui);overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
header{display:flex;gap:10px;align-items:center;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:14px;margin:0 8px 0 0;font-weight:600;letter-spacing:.02em}
header h1 b{color:var(--acc)}
button,.btn{font:inherit;color:var(--fg);background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:6px 11px;cursor:pointer}
button:hover,.btn:hover{border-color:var(--mut)}
button.pri{background:var(--acc);border-color:var(--acc);color:#1a0d05;font-weight:600}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible,.cell:focus-visible{outline:2px solid var(--acc2);outline-offset:1px}
.sp{flex:1}
.stat{color:var(--mut);font-family:var(--mono);font-size:12px}
main{flex:1;display:grid;grid-template-columns:230px minmax(0,1fr) 330px;min-height:0}
aside{background:var(--panel);overflow:auto;min-height:0}
#cats{border-right:1px solid var(--line)}
#insp{border-left:1px solid var(--line);padding:12px}
.sech{padding:10px 12px 6px;color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.09em}
.cat{display:flex;justify-content:space-between;gap:6px;padding:6px 12px;cursor:pointer;border-left:3px solid transparent}
.cat:hover{background:var(--panel2)}
.cat.on{background:var(--panel2);border-left-color:var(--acc)}
.cat span:last-child{color:var(--mut);font-family:var(--mono);font-size:12px}
.cat.sub{padding-left:26px;font-size:12px}
#mid{display:flex;flex-direction:column;min-width:0;min-height:0}
#tools{display:flex;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);align-items:center;flex-wrap:wrap}
#q{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:5px;padding:6px 9px;min-width:0;flex:1;max-width:280px;font:inherit}
label.chip{display:flex;gap:5px;align-items:center;color:var(--mut)}
#grid{flex:1;overflow:auto;padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;align-content:start}
.cell{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px;cursor:pointer;min-width:0}
.cell:hover{border-color:var(--mut)}
.cell.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.cell .th{height:92px;display:flex;align-items:center;justify-content:center;background:repeating-conic-gradient(var(--chk1) 0 25%,var(--chk2) 0 50%) 0 0/12px 12px;border-radius:3px;overflow:hidden}
.cell canvas{max-width:100%;max-height:92px;image-rendering:pixelated}
.cell .m{display:flex;justify-content:space-between;margin-top:5px;font:11px var(--mono);color:var(--mut)}
.cell.mod .m span:first-child{color:var(--ok)}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:50px 20px}
.empty h2{color:var(--fg);font-size:16px;margin:0 0 8px}
#drop{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;font-size:20px;z-index:20;pointer-events:none}
#drop.on{display:flex}
#big{background:repeating-conic-gradient(var(--chk1) 0 25%,var(--chk2) 0 50%) 0 0/16px 16px;border:1px solid var(--line);border-radius:6px;height:230px;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:10px}
#big canvas{image-rendering:pixelated;max-width:100%;max-height:100%}
.tabs{display:flex;gap:4px;margin-bottom:8px}
.tabs button{padding:3px 9px;font-size:12px}
.tabs button.on{background:var(--acc2);border-color:var(--acc2)}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin:10px 0;font-size:12px}
dt{color:var(--mut)} dd{margin:0;font-family:var(--mono);word-break:break-all}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.note{color:var(--mut);font-size:11.5px;margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.toast{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:8px 14px;border-radius:6px;z-index:30}
#view{flex:1;position:relative;min-height:0;display:none;background:#0d0f12}
#view canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;left:12px;top:10px;font:12px var(--mono);color:var(--mut);pointer-events:none;text-shadow:0 1px 2px #000}
#mus{flex:1;overflow:auto;padding:12px;display:none}
.mrow{display:grid;grid-template-columns:34px minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--line)}
.mrow .id{font:12px var(--mono);color:var(--mut)}
.mrow.has{background:var(--panel)}
.mrow .fn{color:var(--ok);font:12px var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#lang{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:5px;padding:5px 6px;font:inherit}
.modes{display:flex;gap:2px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px}
.modes button{border:0;background:transparent;padding:4px 12px}
.modes button.on{background:var(--acc);color:#1a0d05;font-weight:600}
#prog{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:40;padding:16px}
#prog.on{display:flex}
#prog .box{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px;width:min(520px,100%)}
#prog h3{margin:0 0 10px;font-size:15px}
#bar{height:10px;background:var(--bg);border:1px solid var(--line);border-radius:6px;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:var(--acc)}
#plog{max-height:150px;overflow:auto;font:11.5px var(--mono);color:var(--mut);margin-top:10px;white-space:pre-wrap}
#ptxt{margin-top:8px;font-family:var(--mono);font-size:12px}
@media(max-width:900px){main{grid-template-columns:1fr;grid-template-rows:auto 1fr auto;overflow:auto}#cats{max-height:150px;border-right:0;border-bottom:1px solid var(--line)}#insp{border-left:0;border-top:1px solid var(--line)}body{overflow:auto}#app{height:auto;min-height:100%}#grid{max-height:60vh}}
</style>

// ---- o2r / reloc core (works in node and browser) ----

function scanSprites(r,byId,out){

function findDescArrays(r){

      if(bad||(Math.abs(fl(p+32))<1e-4&&Math.abs(fl(p+36))<1e-4)){ok=false;break}
      prev=lv;n++;p+=44;if(n>80)break}

  try{const d=window.claude&&await claude.use('downloads');if(d){await d.save({filename,data});return}}catch(e){if(e&&e.code==='declined')return}
  try{const u=URL.createObjectURL(new Blob([data]));const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
  catch(e){toast(T('Download is not available in this view'))}
}
async function buildPack(ext){
  const files={};let n=0;const list=[...ST.repl.keys()];let done=0;
  P.start(T('Building the pack'),list.length);
  for(const t of ST.tex){const r=ST.repl.get(t.key);if(!r)continue;
    if(P.cancel)return null;
    const strips=t.sprite?t.strips:[t];let y0=0;
    for(const s of strips){
      const px=M.M.renderStrip(ST.idx,s);const crc=M.M.crc32(px);
      const sy=Math.round(y0*r.k),sh=Math.round(s.h*r.k),sw=Math.round(s.w*r.k);
      const c=document.createElement('canvas');c.width=sw;c.height=sh;c.getContext('2d').drawImage(r.canvas,0,sy,sw,sh,0,0,sw,sh);
      const nm=(t.src.split('/').pop()+'_'+s.off.toString(16)).replace(/[^\w-]/g,'_')+'#'+hex(crc)+'#'+s.fmt.toString(16).toUpperCase()+'#'+s.siz.toString(16).toUpperCase()+'.png';
      files[nm]=[await pngBytes(c),{level:0}];n++;y0+=s.h}
    P.step(++done)}
  files['README.txt']=new TextEncoder().encode('Hi-res texture pack for BattleShipDX. Copy this file into the mods folder (next to BattleShip.o2r).\n');
  return {bytes:fflate.zipSync(files),n};
}
async function exportPack(ext){
  if(!ST.repl.size)return;
  const r=await buildPack(ext);if(!r){P.end(T('Cancelled'));return}
  P.end(T('Done: {0} images',r.n));
  save('BattleShipDX-HiRes-Pack.'+ext,r.bytes);
}

  step(i){const el=(performance.now()-this.t0)/1000,rate=i/Math.max(el,0.001),left=rate>0?(this.total-i)/rate:0;
    $('#bar i').style.width=(this.total?i/this.total*100:100)+'%';
    $('#ptxt').textContent=i+' / '+this.total+' · '+Math.round(i/Math.max(1,this.total)*100)+'% · '+fmtT(el)+' '+T('elapsed')+(i>2&&i<this.total?' · '+T('~{0} left',fmtT(left)):'')},
  log(s){const l=$('#plog');l.textContent+=s+'\n';l.scrollTop=l.scrollHeight},

function texPath(t,used){
  const cat=catOf(t),base=t.src.split('/').pop();
  let nm=cat+'/'+base+'_'+(t.sprite?'spr':'')+t.off.toString(16)+'_'+t.w+'x'+t.h+'.png';
  if(used.has(nm.toLowerCase())){let k=2;while(used.has(nm.toLowerCase().replace('.png','_'+k+'.png')))k++;nm=nm.replace('.png','_'+k+'.png')}
  used.add(nm.toLowerCase());return nm;
}
function nameMap(){if(ST._nm)return ST._nm;const used=new Set(),m=new Map();for(const t of ST.tex)m.set(texPath(t,used),t);return ST._nm=m}
async function downloadAll(){
  const nm=nameMap();const files={};let i=0;P.start(T('Exporting textures to PNG'),nm.size);
  const c=document.createElement('canvas');
  for(const [path,t] of nm){
    if(P.cancel){P.end(T('Cancelled'));return}
    drawRGBA(c,getPx(t),t.w,t.h);files[path]=[await pngBytes(c),{level:0}];
    if(++i%25===0){P.step(i);await yieldUI()}
  }
  P.step(i);files['README.txt']=new TextEncoder().encode('Edit the PNGs without renaming them or changing their proportions (you can make them x2, x4...). Then use "Import edited folder" in the editor.\n');
  P.end(T('Done: {0} textures',i));
  save('BattleShipDX-Textures.zip',fflate.zipSync(files));
}

async function importFolder(fileList){
  const nm=nameMap();const byBase=new Map();for(const [p,t] of nm)byBase.set(p.split('/').pop().toLowerCase(),t);
  const fs=[...fileList].filter(f=>/\.png$/i.test(f.name));
  if(!fs.length){toast(T('The folder has no PNG files'));return}
  P.start(T('Importing edited textures'),fs.length);let ok=0,same=0,bad=0,unk=0,i=0;
  const cmp=document.createElement('canvas'),cx=cmp.getContext('2d',{willReadFrequently:true});
  for(const f of fs){
    if(P.cancel){P.end(T('Cancelled'));break}
    const t=byBase.get(f.name.toLowerCase());
    if(!t){unk++;if(unk<=5)P.log(T('Unrecognized name: {0}',f.name))}
    else{
      try{
        const bm=await createImageBitmap(f);const kx=bm.width/t.w,ky=bm.height/t.h;
        if(Math.abs(kx-ky)>0.02||bm.width<t.w){bad++;P.log(T('Different proportions ({0}×{1} vs {2}×{3}): {4}',bm.width,bm.height,t.w,t.h,f.name))}
        else{
          let changed=true;
          if(bm.width===t.w&&bm.height===t.h){cmp.width=t.w;cmp.height=t.h;cx.clearRect(0,0,t.w,t.h);cx.drawImage(bm,0,0);
            const a=cx.getImageData(0,0,t.w,t.h).data,b=getPx(t);changed=false;for(let q=0;q<a.length;q++){if(a[q]!==b[q]&&!(a[q-(q%4)+3]===0&&b[q-(q%4)+3]===0)){changed=true;break}}}
          if(!changed)same++;else{const c=document.createElement('canvas');c.width=bm.width;c.height=bm.height;c.getContext('2d').drawImage(bm,0,0);ST.repl.set(t.key,{canvas:c,w:c.width,h:c.height,k:kx});ok++}
        }
        bm.close&&bm.close();
      }catch(e){bad++;P.log(T('Could not read: {0}',f.name))}
    }
    if(++i%10===0){P.step(i);await yieldUI()}
  }
  P.step(i);P.end(T('Replaced {0} · unchanged {1} · errors {2} · unknown {3}',ok,same,bad,unk));
  updMod();if(MODE==='tex')render();
}

function buildLevels(){

  if(!ST.idx){el.innerHTML='<div class="note" style="border:0">'+T('Open the .o2r first.')+'</div>';return}

  const maps=names.filter(n=>/^reloc_stages\/GR\w+Map$/.test(n)).sort((a,b)=>stageName(a).localeCompare(stageName(b)));

function keyIndex(){if(ST._tk)return ST._tk;const m=new Map();for(const t of ST.tex)m.set(t.key,t);return ST._tk=m}
function entryFor(g){
  const i=g.info;if(!g.tex||!i)return null;
  const at=g.tex.lastIndexOf('@');const file=g.tex.slice(0,at),off=+g.tex.slice(at+1);
  const key=g.tex+'/'+i.fmt+i.siz+'/'+i.w+'x'+i.h+(i.fmt===2?'/'+(i.tlut||''):'');
  const ix=keyIndex();let t=ix.get(key);if(t)return t;
  let pal=null;if(i.fmt===2&&i.tlut){const a=i.tlut.lastIndexOf('@');pal={file:i.tlut.slice(0,a),off:+i.tlut.slice(a+1),count:i.tlutCount||16}}
  t={key,file,off,fmt:i.fmt,siz:i.siz,w:i.w,h:i.h,line:i.line,pal,src:file};
  ST.tex.push(t);ix.set(key,t);ST._nm=null;return t;
}
function initGL(){
  if(GL||!window.THREE)return;
  const cv=$('#gl');const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true});
  const scene=new THREE.Scene();scene.background=new THREE.Color(0x0d0f12);
  const cam=new THREE.PerspectiveCamera(45,1,1,1e6);
  GL={renderer,scene,cam,root:null,az:0.4,el:0.25,dist:1000,target:new THREE.Vector3(),mats:new Map(),down:null};
  const rs=()=>{const r=$('#view').getBoundingClientRect();renderer.setSize(r.width,r.height,false);cam.aspect=r.width/Math.max(1,r.height);cam.updateProjectionMatrix();draw()};
  new ResizeObserver(rs).observe($('#view'));
  const drag={on:false,x:0,y:0,pan:false,moved:0};
  cv.addEventListener('pointerdown',e=>{drag.on=true;drag.x=e.clientX;drag.y=e.clientY;drag.pan=e.shiftKey||e.button===2;drag.moved=0;cv.setPointerCapture(e.pointerId)});
  cv.addEventListener('pointermove',e=>{if(!drag.on)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.x=e.clientX;drag.y=e.clientY;drag.moved+=Math.abs(dx)+Math.abs(dy);
    if(drag.pan){const s=GL.dist*0.0015;const r=new THREE.Vector3().setFromMatrixColumn(cam.matrix,0),u=new THREE.Vector3().setFromMatrixColumn(cam.matrix,1);GL.target.addScaledVector(r,-dx*s).addScaledVector(u,dy*s)}
    else{GL.az-=dx*0.006;GL.el=Math.max(-1.5,Math.min(1.5,GL.el+dy*0.006))}draw()});
  cv.addEventListener('pointerup',e=>{drag.on=false;if(drag.moved<4)pick(e)});
  cv.addEventListener('contextmenu',e=>e.preventDefault());
  cv.addEventListener('wheel',e=>{e.preventDefault();GL.dist*=Math.exp(e.deltaY*0.001);draw()},{passive:false});
  rs();
}
function draw(){if(!GL)return;const {cam,target,az,el,dist}=GL;cam.position.set(target.x+dist*Math.sin(az)*Math.cos(el),target.y+dist*Math.sin(el),target.z+dist*Math.cos(az)*Math.cos(el));cam.lookAt(target);GL.renderer.render(GL.scene,cam)}
function matFor(key,t){
  if(GL.mats.has(key))return GL.mats.get(key);
  const m=new THREE.MeshBasicMaterial({vertexColors:true,transparent:true,alphaTest:0.35,side:THREE.DoubleSide});
  m.userData.t=t||null;GL.mats.set(key,m);applyTex(m);return m;
}
function applyTex(m){
  const t=m.userData.t;if(!t){m.map=null;m.needsUpdate=true;return}
  const r=ST.repl.get(t.key);let cvs;
  if(r)cvs=r.canvas;else{cvs=document.createElement('canvas');drawRGBA(cvs,getPx(t),t.w,t.h)}
  if(m.map)m.map.dispose();
  const tx=new THREE.CanvasTexture(cvs);tx.wrapS=tx.wrapT=THREE.RepeatWrapping;tx.magFilter=THREE.NearestFilter;tx.minFilter=THREE.LinearMipmapLinearFilter;
  m.map=tx;m.needsUpdate=true;
}
function refresh3D(){if(!GL)return;for(const m of GL.mats.values())applyTex(m);draw()}
function show3D(name){
  if(!GL)initGL();if(!GL)return;
  GL.mats.forEach(m=>{if(m.map)m.map.dispose();m.dispose()});GL.mats.clear();
  if(GL.root){GL.scene.remove(GL.root);GL.root.traverse(o=>o.geometry&&o.geometry.dispose())}
  const sc=M.buildScene(ST.idx,name);const root=new THREE.Group();let tris=0,texn=new Set();
    for(const part of sc.parts){const stack=[];
    for(const n of part.nodes){
      const o=new THREE.Object3D();o.position.set(...n.T);o.rotation.order='ZYX';o.rotation.set(n.R[0],n.R[1],n.R[2]);o.scale.set(...n.S);
      (n.level>0&&stack[n.level-1]?stack[n.level-1]:root).add(o);stack.length=n.level;stack[n.level]=o;
      for(const g of n.groups){
        const t=entryFor(g),tw=t?t.w:32,th=t?t.h:32;const cnt=g.v.length;
        const pos=new Float32Array(cnt*3),uv=new Float32Array(cnt*2),col=new Float32Array(cnt*3);
        for(let i=0;i<cnt;i++){const v=g.v[i];pos[i*3]=v[0];pos[i*3+1]=v[1];pos[i*3+2]=v[2];uv[i*2]=v[3]/32/tw;uv[i*2+1]=1-v[4]/32/th;col[i*3]=v[5]/255;col[i*3+1]=v[6]/255;col[i*3+2]=v[7]/255}
        const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(pos,3));geo.setAttribute('uv',new THREE.BufferAttribute(uv,2));geo.setAttribute('color',new THREE.BufferAttribute(col,3));
        const mesh=new THREE.Mesh(geo,matFor(t?t.key:'',t));o.add(mesh);tris+=cnt/3;if(t)texn.add(t.key)}}}
  GL.scene.add(root);GL.root=root;root.updateMatrixWorld(true);
  const box=new THREE.Box3().setFromObject(root);
  if(!box.isEmpty()){const c=box.getCenter(new THREE.Vector3()),s=box.getSize(new THREE.Vector3());GL.target.copy(c);GL.dist=Math.max(s.x,s.y,s.z)*1.6+10}
  GL.az=0;GL.el=0.15;
  $('#hud').textContent=stageName(name)+' · '+T('{0} parts · {1} triangles · {2} textures · drag=rotate · shift+drag=pan · wheel=zoom · click=pick texture',sc.parts.length,tris,texn.size);
  draw();
}
const ray=new THREE.Raycaster?null:null;
function pick(e){
  if(!GL||!GL.root)return;const r=$('#gl').getBoundingClientRect();
  const rc=new THREE.Raycaster();rc.setFromCamera(new THREE.Vector2((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1),GL.cam);
  const hits=rc.intersectObject(GL.root,true).filter(h=>h.object.material&&h.object.material.userData.t);
  if(hits.length){select(hits[0].object.material.userData.t)}
}

  $('#expMus').disabled=!(MS.files.size||MS.free.length);
}
$('#expMus').onclick=()=>{const fl={};for(const [id,f] of MS.files)fl['music/'+id+(f.loop?'':'_once')+'.'+f.ext]=[f.bytes,{level:0}];
  for(const f of MS.free)fl['music/'+f.name+(f.loop?'':'_once')+'.'+f.ext]=[f.bytes,{level:0}];
  fl['README.txt']=new TextEncoder().encode('Music pack for BattleShipDX. Copy this file into the mods folder next to BattleShip.o2r. Pick tracks in Assets > Audio Editor.\n');
  save('BattleShipDX-Music-Pack.zip',fflate.zipSync(fl));toast(T('{0} tracks in the pack',MS.files.size+MS.free.length))};

$('#lang').onchange=e=>{LANG=e.target.value;try{localStorage.setItem('lang',LANG)}catch(x){}applyLang()};
if(LANG!=='en')applyLang();else $('#lang').value='en';
</script>
